name: Build and release

# Rust core + Tauri 2 + Svelte app for Windows, macOS and Linux.
# Pushing a tag named vMAJOR.MINOR.PATCH (matching the version in package.json) publishes a GitHub release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test (${{ matrix.name }})
    # scripts/release.mjs pushes main and the tag together, which starts two runs. The tag run does the same work and
    # then publishes, so the run for the "Release vX.Y.Z" commit on main is skipped (bundle follows through `needs`).
    if: ${{ github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'Release v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
          - { name: Linux, os: ubuntu-22.04 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: .

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
          package_json_file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Core tests (mock servers, no API token)
        run: cargo test -p rdbatch-core --locked

      - name: Install front-end dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check the UI
        run: pnpm check

      - name: UI logic tests
        run: pnpm test

      - name: Every UI string has an English translation
        run: node scripts/check-i18n.mjs

      - name: Compile the desktop shell
        run: cargo check -p rdbatch-desktop --locked

  bundle:
    name: Bundle (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, args: '', glob: 'target/release/bundle' }
          - { name: macOS (universal), os: macos-latest, args: '--target universal-apple-darwin', glob: 'target/universal-apple-darwin/release/bundle' }
          - { name: Linux, os: ubuntu-22.04, args: '', glob: 'target/release/bundle' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: .

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
          package_json_file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install front-end dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers
        run: pnpm tauri build ${{ matrix.args }}

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          # Installers only: the bundle folder also holds intermediate build files.
          find "${{ matrix.glob }}" -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \)             -not -path '*/wix/*' -exec cp {} dist/ \;
          ls -la dist
          test -n "$(ls -A dist)"

      # Reuses the executable the installer build just produced, so nothing is compiled twice.
      - name: Build portable zip (Windows)
        if: runner.os == 'Windows'
        run: |
          node scripts/build-portable.mjs --skip-build
          Remove-Item dist/portable -Recurse -Force

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DebridDock-desktop-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: bundle
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag must match the app version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -c "import json; print(json.load(open('package.json'))['version'])")"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi

      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: DebridDock-desktop-*
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes=$'Unsigned builds.\n\n- macOS: the app is not notarized yet. Open it with right-click, Open, or run `xattr -dr com.apple.quarantine "/Applications/DebridDock.app"`.\n- Windows: SmartScreen may warn about an unrecognized publisher.\n- Linux: AppImage needs `chmod +x`; the .deb and .rpm need a Secret Service keyring (GNOME Keyring or KWallet) to remember the API token.'
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=(--prerelease); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --title "DebridDock ${RELEASE_TAG#v}" --notes "$notes" "${prerelease[@]}"
          fi
