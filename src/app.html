<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DebridDock</title>
    <style>
      /* Until the shell mounts, let the native WebView supply the saved theme's background. */
      html:has(#startup), body:has(> #startup) { background: transparent; color-scheme: only light; }
      #startup { position: fixed; inset: 0; display: grid; place-items: center; }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="startup" role="status"><img src="%sveltekit.assets%/favicon.png" width="32" height="32" alt="DebridDock" /></div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
