[package]
name = "rdbatch-desktop"
version = "0.3.9"
description = "Batch downloads from Real-Debrid, TorBox and AllDebrid"
authors = ["DebridDock contributors"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary on Windows (cargo issue 8519).
name = "rdbatch_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rdbatch-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["sync", "time"] }
tokio-util = "0.7"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
tauri-plugin-updater = "2"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# Paints the native title bar in the app's colors (src/theme.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }
